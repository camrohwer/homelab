apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: infrastructure
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  project: default

  source:
    repoURL: https://github.com/camrohwer/homelab.git
    targetRevision: main
    path: gitops/infrastructure
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
