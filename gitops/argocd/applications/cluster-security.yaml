apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cluster-security
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  project: default

  source:
    repoURL: https://github.com/camrohwer/homelab.git
    targetRevision: main
    path: gitops/infrastructure/cert-manager/cluster-security

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
