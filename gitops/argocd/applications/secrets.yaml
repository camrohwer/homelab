apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: secrets
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  project: default

  source:
    repoURL: https://github.com/camrohwer/homelab.git
    targetRevision: main
    path: gitops/secrets

    plugin:
      name: sops

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
