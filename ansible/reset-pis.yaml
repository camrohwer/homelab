---
- name: HARD RESET k3s nodes
  hosts: all
  become: true

  tasks:
    - name: Stop k3s server
      ansible.builtin.systemd:
        name: k3s
        state: stopped
      when: inventory_hostname in groups['masters']
      ignore_errors: true

    - name: Stop k3s agent
      ansible.builtin.systemd:
        name: k3s-agent
        state: stopped
      when: inventory_hostname in groups['workers']
      ignore_errors: true

    - name: Run k3s server uninstall script
      ansible.builtin.shell: |
        /usr/local/bin/k3s-uninstall.sh
      when:
        - inventory_hostname in groups['masters']
        - ansible_facts.exists['/usr/local/bin/k3s-uninstall.sh'] | default(false)
      ignore_errors: true

    - name: Run k3s agent uninstall script
      ansible.builtin.shell: |
        /usr/local/bin/k3s-agent-uninstall.sh
      when:
        - inventory_hostname in groups['workers']
        - ansible_facts.exists['/usr/local/bin/k3s-agent-uninstall.sh'] | default(false)
      ignore_errors: true

    - name: Remove k3s directories
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/rancher
        - /var/lib/rancher
        - /var/lib/kubelet
        - /var/lib/cni
        - /etc/cni
        - /opt/cni
        - /run/k3s

    - name: Remove leftover k3s binaries
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/bin/k3s
        - /usr/local/bin/k3s-agent
        - /usr/local/bin/kubectl

    - name: Flush iptables (clean networking state)
      shell: iptables -F
      ignore_errors: yes

    - name: Remove all containers (if containerd tools exist)
      shell: |
        if command -v crictl >/dev/null 2>&1; then
          crictl rm -f $(crictl ps -aq) || true
        fi
      ignore_errors: yes

    - name: Reboot node
      reboot:
        reboot_timeout: 600
