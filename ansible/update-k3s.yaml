---
- name: Update k3s cluster
  hosts: all 
  become: true 
  serial: 1 
  
  tasks: 
    - name: Update apt package cache 
      ansible.builtin.apt: 
        update_cache: true 
        cache_valid_time: 3600 

    - name: Upgrade all packages 
      ansible.builtin.apt: 
        upgrade: dist 

    - name: Remove unnecessary packages 
      ansible.builtin.apt: 
          autoremove: true 

    - name: Clean apt package cache 
      ansible.builtin.apt: 
        autoclean: true 

    - name: Check if reboot is required 
      ansible.builtin.stat: 
        path: /var/run/reboot-required 
      register: reboot_required 

    - name: Report reboot requirement 
      ansible.builtin.debug: 
        msg: >- 
          {{ inventory_hostname }}: 
          {{ 'REBOOT REQUIRED' if reboot_required.stat.exists else 'No reboot required' }}
